name: Build and Push Docker Image - v16

on:
  push:
    branches:
      - develop

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Clone frappe_docker Template
        run: git clone --depth 1 https://github.com/careyogis/frappe_docker

      - name: Build and Push Monolithic Image
        uses: docker/build-push-action@v5
        with:
          context: ./frappe_docker
          file: ./frappe_docker/images/layered/Containerfile
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/careyogi-erpnext:v16.${{ github.run_number }}
          build-args: |
            FRAPPE_BRANCH=version-16
          secret-files: |
            apps_json=./frappe_docker/apps.json

      # - name: Trigger CD Deployment on Host VM
