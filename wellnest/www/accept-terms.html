{% extends "templates/web.html" %}

{% block page_content %}
<h2 id="t-and-c-title">Terms & Conditions</h2>

<!-- Container where Terms & Conditions content will be injected dynamically -->
<div id="t-and-c" style="border:1px solid #ccc; padding:20px; margin-bottom:30px;">
  <!-- Initially show loading text -->
  Loading Terms & Conditions...
</div>

<!-- Button to accept Terms. Will be hidden/shown based on API response -->
<button id="accept-btn" onclick="acceptTerms()">I Accept</button>

<!-- Section for UPI Payment (hidden until T&C accepted) -->
<div id="payment-section" style="display:none; margin-top: 30px;">
  <h3>Make Payment</h3>
  <p>Scan QR code using UPI app:</p>
  <img id="upi-qr" src="" width="200" />
</div>

<script>
  // ✅ Get "customer_id" from URL query params (e.g. ?customer_id=CUST-0001)
  const params = new URLSearchParams(window.location.search);
  const customer_id = params.get("customer_id");

  // If no customer_id is passed in URL, stop execution
  if (!customer_id) {
    alert('Invalid link. Customer ID missing');
    throw new Error('Customer ID missing');
  }

  // ✅ Load latest Terms & Conditions content from backend
  async function loadTerms() {
    try {
      // Call backend API to fetch active T&C document
      const res = await fetch("/api/method/wellnest.api.get_terms_content");
      const data = await res.json();

      if (data.message && data.message.success) {
        // API returns "title" and "content" → place into HTML
        document.getElementById("t-and-c").innerHTML = data.message.content;
        document.getElementById("t-and-c-title").innerText = data.message.title;
      } else {
        // If no T&C found, show message and disable Accept button
        document.getElementById("t-and-c").innerHTML = "No active Terms & Conditions found.";
        document.getElementById("accept-btn").disabled = true;
      }
    } catch (err) {
      // If API fails, show error
      document.getElementById("t-and-c").innerHTML = "Error loading Terms & Conditions.";
      console.error(err);
    }
  }

  // ✅ On page load → check current T&C acceptance + payment status
  window.addEventListener("DOMContentLoaded", () => {
    // Step 1: Load Terms & Conditions
    loadTerms();

    // Step 2: Call backend to check payment + acceptance status
    fetch(`/api/method/wellnest.api.get_payment_details?customer_id=${customer_id}`)
      .then(res => res.json())
      .then(data => {
        if (data.message && data.message.success) {
          const upi_uri = data.message.data?.upi_uri;   // Payment QR data
          const accepted = data.message.data?.accepted; // Whether T&C already accepted
          const status = data.message.data?.status;     // Invoice/payment status

          // Case 1: Already Paid
          if (status === "paid") {
            document.getElementById("t-and-c").style.display = "none";
            document.getElementById("accept-btn").style.display = "none";
            document.getElementById("payment-section").innerHTML = "<p>✅ Thank you! Your payment is already completed.</p>";
            document.getElementById("payment-section").style.display = "block";

          } else {
            // Case 2: Not paid yet
            if (!accepted) {
              // Show Accept button if T&C not accepted yet
              document.getElementById("accept-btn").style.display = "block";
            } else {
              // If T&C accepted → hide button, show QR code for payment
              document.getElementById("accept-btn").style.display = "none";
              if (upi_uri) {
                const qr_url = `https://api.qrserver.com/v1/create-qr-code/?data=${encodeURIComponent(upi_uri)}&size=200x200`;
                document.getElementById("upi-qr").src = qr_url;
                document.getElementById("payment-section").style.display = "block";
              }
            }
          }
        } else {
          // If backend gives no data → show Accept button as fallback
          document.getElementById("accept-btn").style.display = "block";
        }
      })
      .catch(() => {
        alert("Server error. Please try again.");
      });
  });

  // ✅ Triggered when user clicks "I Accept"
  async function acceptTerms() {
    try {
      // CSRF token required for POST in Frappe
      const csrfToken = frappe.csrf_token;

      // Call backend API to mark Terms as accepted
      const response = await fetch("/api/method/wellnest.api.accept_terms", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Frappe-CSRF-Token": csrfToken
        },
        body: JSON.stringify({ customer_id })
      });

      const data = await response.json();

      if (data.message && data.message.success) {
        // Hide button and show payment QR after successful acceptance
        document.getElementById("accept-btn").style.display = "none";
        showPaymentSection();
      } else {
        // If backend fails, show error
        alert(data.message?.error || "Something went wrong. Please try again.");
      }
    } catch (error) {
      console.error("❌ Exception in acceptTerms():", error);
      alert("Server error. Please try again later.");
    }
  }

  // ✅ Helper: Refresh payment section after acceptance
  function showPaymentSection() {
    fetch(`/api/method/wellnest.api.get_payment_details?customer_id=${customer_id}`)
      .then(r => r.json())
      .then(data => {
        if (data.message && data.message.success) {
          const upi_uri = data.message.data?.upi_uri;

          if (upi_uri) {
            // Generate QR code for UPI payment
            const qr_url = `https://api.qrserver.com/v1/create-qr-code/?data=${encodeURIComponent(upi_uri)}&size=200x200`;
            document.getElementById("upi-qr").src = qr_url;
            document.getElementById("payment-section").style.display = "block";
          } else {
            // If no UPI URI, assume already paid
            document.getElementById("t-and-c").style.display = "none";
            document.getElementById("payment-section").innerHTML = "<p>✅ Thank you! Your payment is already completed.</p>";
            document.getElementById("payment-section").style.display = "block";
          }
        } else {
          alert(data.message?.error || "Could not load payment details.");
        }
      })
      .catch(() => {
        alert('Server error. Please try again later.');
      });
  }
</script>

{% endblock %}
