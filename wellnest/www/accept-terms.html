{% extends "templates/web.html" %}

{% block page_content %}
<h2 id="t-and-c-title">Terms & Conditions</h2>

<!-- Terms & Conditions container -->
<div id="t-and-c" style="border:1px solid #ccc; padding:20px; margin-bottom:30px;">
  Loading Terms & Conditions...
</div>

<!-- Accept button -->
<button id="accept-btn" onclick="acceptTerms()">I Accept</button>

<!-- Payment section -->
<div id="payment-section" style="display:none; margin-top: 30px;">
  <h3>Make Payment</h3>
  <p>Scan QR code using UPI app:</p>
  <img id="upi-qr" src="" width="200" />
</div>

<script>
const params = new URLSearchParams(window.location.search);
const customer_id = params.get("customer_id");

if (!customer_id) {
  alert('Invalid link. Customer ID missing');
  throw new Error('Customer ID missing');
}

// ---------------------------
// Load Terms & Conditions
// ---------------------------
async function loadTerms() {
  try {
    const res = await fetch("/api/method/wellnest.api.get_terms_content");
    const data = await res.json();
    if (data.message && data.message.success) {
      document.getElementById("t-and-c").innerHTML = data.message.content;
      document.getElementById("t-and-c-title").innerText = data.message.title;
    } else {
      document.getElementById("t-and-c").innerHTML = "No active Terms & Conditions found.";
      document.getElementById("accept-btn").disabled = true;
    }
  } catch (err) {
    document.getElementById("t-and-c").innerHTML = "Error loading Terms & Conditions.";
    console.error(err);
  }
}

// ---------------------------
// Refresh UI based on status
// ---------------------------
// ---------------------------
// Refresh UI based on status
// ---------------------------
async function refreshStatus() {
  const tncDiv = document.getElementById("t-and-c");
  const acceptBtn = document.getElementById("accept-btn");
  const paymentSection = document.getElementById("payment-section");

  try {
    const res = await fetch(`/api/method/wellnest.api.get_payment_details?customer_id=${customer_id}`);
    const data = await res.json();

    if (data.message && data.message.success) {
      const info = data.message.data;
      const status = (info.status || "pending").toLowerCase(); // pending / accepted / paid
      const upi_uri = info.upi_uri;

      if (status === "paid") {
        // -------------------
        // Paid → show Thank You only
        // -------------------
        tncDiv.style.display = "none";
        acceptBtn.style.display = "none";
        paymentSection.innerHTML = "<p>✅ Thank you! Your payment is already completed.</p>";
        paymentSection.style.display = "block";
      } 
      else if (status === "accepted") {
        // -------------------
        // Accepted but unpaid → show T&C + QR
        // -------------------
        tncDiv.style.display = "block";
        acceptBtn.style.display = "none";

        if (upi_uri) {
          const qr_url = `https://api.qrserver.com/v1/create-qr-code/?data=${encodeURIComponent(upi_uri)}&size=200x200`;
          document.getElementById("upi-qr").src = qr_url;
          paymentSection.style.display = "block";
        } else {
          // Safety: hide payment section if no QR available
          paymentSection.style.display = "none";
        }
      } 
      else {
        // -------------------
        // Pending → show T&C + Accept button, hide QR
        // -------------------
        tncDiv.style.display = "block";
        acceptBtn.style.display = "block";
        paymentSection.style.display = "none";
      }
    } else {
      // Fallback: show T&C + Accept button
      tncDiv.style.display = "block";
      acceptBtn.style.display = "block";
      paymentSection.style.display = "none";
    }

  } catch (err) {
    console.error("Error in refreshStatus():", err);
    alert("Server error. Please try again.");
  }
}



// ---------------------------
// Accept T&C
// ---------------------------
async function acceptTerms() {
  try {
    const csrfToken = frappe.csrf_token;

    const response = await fetch("/api/method/wellnest.api.accept_terms", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Frappe-CSRF-Token": csrfToken
      },
      body: JSON.stringify({ customer_id })
    });

    const data = await response.json();

    if (data.message && data.message.success) {
      document.getElementById("accept-btn").style.display = "none";
      refreshStatus();
    } else {
      alert(data.message?.error || "Something went wrong. Please try again.");
    }
  } catch (error) {
    console.error("Exception in acceptTerms():", error);
    alert("Server error. Please try again later.");
  }
}

window.addEventListener("DOMContentLoaded", () => {
  loadTerms();
  refreshStatus();
});
</script>
{% endblock %}
